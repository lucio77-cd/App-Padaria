<head>

  <link rel="stylesheet" href="style.css">
  <style>
    .mesas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }

    .mesa-card {
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2.5px solid transparent;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
      gap: 6px;
      user-select: none;
    }

    .mesa-card:hover  { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .mesa-card:active { transform: scale(0.96); }

    .mesa-card.livre {
      background: var(--livre-bg);
      border-color: #6EE7B7;
    }

    .mesa-card.ocupada {
      background: var(--ocupada-bg);
      border-color: #FCA5A5;
      animation: pulse-ring 2.5s infinite;
    }

    .mesa-num {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .mesa-card.livre   .mesa-num { color: #065F46; }
    .mesa-card.ocupada .mesa-num { color: #991B1B; }

    .mesa-icon { font-size: 1.9rem; line-height: 1; }

    .mesa-valor {
      font-size: 0.95rem;
      font-weight: 800;
      line-height: 1;
    }
    .mesa-card.livre   .mesa-valor { font-size: 0.72rem; font-weight: 500; color: #065F46; }
    .mesa-card.ocupada .mesa-valor { color: #991B1B; }

    .status-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .status-pill {
      display: flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 999px; padding: 6px 14px;
      font-size: 0.8rem; font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .dot-livre   { background: var(--livre); }
    .dot-ocupada { background: var(--ocupada); }

    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow-lg);
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .modal-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .qty-btn {
      width: 52px; height: 52px;
      font-size: 1.4rem;
      font-weight: 700;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--navy);
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .qty-btn:hover { background: var(--border); }

    .qty-val {
      flex: 1;
      text-align: center;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--navy);
    }

    .modal-actions { display: flex; gap: 10px; }
    .modal-actions button { flex: 1; }

    @media (max-width: 768px) {
      .mesas-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .mesa-icon { font-size: 1.5rem; }
    }
    @media (max-width: 360px) {
      .mesas-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
